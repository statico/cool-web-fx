<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Rubik's Cube</title>
  <style>
    /* ─── Reset ───────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ─── Light background ────────────────────────────────────────────── */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #ebebed 50%, #d8d8da 100%);
    }

    /* ─── Wrapper: cube + ground shadow stacked vertically ───────────── */
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ─── Perspective scene ───────────────────────────────────────────── */
    /*
     * 700px perspective on a 240px cube gives a moderate depth effect —
     * enough to read as clearly 3D without extreme fisheye distortion.
     */
    .scene {
      perspective: 700px;
      perspective-origin: 50% 50%;
      width: 240px;
      height: 240px;
    }

    /* ─── The cube ────────────────────────────────────────────────────── */
    /*
     * transform-style: preserve-3d propagates 3D context to child faces.
     * The cube spins on the Y axis while a fixed -28deg X tilt keeps the
     * top face in view, so you see three faces simultaneously at all times.
     */
    .cube {
      width: 240px;
      height: 240px;
      position: relative;
      transform-style: preserve-3d;
      animation: spin 10s linear infinite;
    }

    @keyframes spin {
      from { transform: rotateX(-28deg) rotateY(0deg); }
      to   { transform: rotateX(-28deg) rotateY(360deg); }
    }

    /* ─── Faces ───────────────────────────────────────────────────────── */
    /*
     * Each face is absolutely positioned and fills the cube container
     * (240×240px). The CSS grid creates the 3×3 sticker layout.
     * Black background (#111) acts as the frame and gaps between stickers.
     */
    .face {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 7px;
      padding: 10px;
      background: #111;
      border-radius: 6px;
    }

    /*
     * Each face is translated half the cube's depth (120px) along its
     * natural Z axis, after being rotated into the correct orientation.
     */
    .face-front  { transform: translateZ(120px); }
    .face-back   { transform: rotateY(180deg)  translateZ(120px); }
    .face-right  { transform: rotateY( 90deg)  translateZ(120px); }
    .face-left   { transform: rotateY(-90deg)  translateZ(120px); }
    .face-top    { transform: rotateX( 90deg)  translateZ(120px); }
    .face-bottom { transform: rotateX(-90deg)  translateZ(120px); }

    /* ─── Stickers ────────────────────────────────────────────────────── */
    .sticker {
      border-radius: 4px;
    }

    /* Classic Rubik's cube palette */
    .red    { background: #c91c3b; }
    .orange { background: #ff6a00; }
    .blue   { background: #0046ad; }
    .green  { background: #009651; }
    .yellow { background: #ffdd00; }
    /* White sticker gets a faint inset border so it reads against the bg */
    .white  { background: #f5f5f5; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }

    /* ─── Ground shadow ───────────────────────────────────────────────── */
    /*
     * A flat 2D ellipse below the scene rendered as a blurred radial
     * gradient. It's intentionally kept in normal document flow so it
     * always sits directly beneath the cube regardless of viewport size.
     */
    .shadow {
      width: 260px;
      height: 36px;
      margin-top: 14px;
      background: radial-gradient(ellipse at 50% 60%, rgba(0,0,0,0.22) 0%, transparent 68%);
      filter: blur(6px);
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <!--
    Rotating Rubik's Cube
    ─────────────────────
    Six CSS 3D faces, each a 3×3 grid of sticker divs in classic Rubik's
    colors (red, orange, blue, green, white, yellow). The cube container
    rotates via a CSS @keyframes animation on Y with a fixed X tilt so
    the top face and two side faces are visible simultaneously.

    Face map:
      Front  → Red
      Back   → Orange
      Right  → Blue
      Left   → Green
      Top    → White
      Bottom → Yellow
  -->

  <div class="wrapper">

    <!-- Perspective container — establishes the 3D viewing frustum -->
    <div class="scene">
      <div class="cube">

        <!-- Front: Red ──────────────────────────────────────────────── -->
        <div class="face face-front">
          <div class="sticker red"></div>
          <div class="sticker red"></div>
          <div class="sticker red"></div>
          <div class="sticker red"></div>
          <div class="sticker red"></div>
          <div class="sticker red"></div>
          <div class="sticker red"></div>
          <div class="sticker red"></div>
          <div class="sticker red"></div>
        </div>

        <!-- Back: Orange ────────────────────────────────────────────── -->
        <div class="face face-back">
          <div class="sticker orange"></div>
          <div class="sticker orange"></div>
          <div class="sticker orange"></div>
          <div class="sticker orange"></div>
          <div class="sticker orange"></div>
          <div class="sticker orange"></div>
          <div class="sticker orange"></div>
          <div class="sticker orange"></div>
          <div class="sticker orange"></div>
        </div>

        <!-- Right: Blue ─────────────────────────────────────────────── -->
        <div class="face face-right">
          <div class="sticker blue"></div>
          <div class="sticker blue"></div>
          <div class="sticker blue"></div>
          <div class="sticker blue"></div>
          <div class="sticker blue"></div>
          <div class="sticker blue"></div>
          <div class="sticker blue"></div>
          <div class="sticker blue"></div>
          <div class="sticker blue"></div>
        </div>

        <!-- Left: Green ─────────────────────────────────────────────── -->
        <div class="face face-left">
          <div class="sticker green"></div>
          <div class="sticker green"></div>
          <div class="sticker green"></div>
          <div class="sticker green"></div>
          <div class="sticker green"></div>
          <div class="sticker green"></div>
          <div class="sticker green"></div>
          <div class="sticker green"></div>
          <div class="sticker green"></div>
        </div>

        <!-- Top: White ──────────────────────────────────────────────── -->
        <div class="face face-top">
          <div class="sticker white"></div>
          <div class="sticker white"></div>
          <div class="sticker white"></div>
          <div class="sticker white"></div>
          <div class="sticker white"></div>
          <div class="sticker white"></div>
          <div class="sticker white"></div>
          <div class="sticker white"></div>
          <div class="sticker white"></div>
        </div>

        <!-- Bottom: Yellow ──────────────────────────────────────────── -->
        <div class="face face-bottom">
          <div class="sticker yellow"></div>
          <div class="sticker yellow"></div>
          <div class="sticker yellow"></div>
          <div class="sticker yellow"></div>
          <div class="sticker yellow"></div>
          <div class="sticker yellow"></div>
          <div class="sticker yellow"></div>
          <div class="sticker yellow"></div>
          <div class="sticker yellow"></div>
        </div>

      </div><!-- /.cube -->
    </div><!-- /.scene -->

    <!-- Ground shadow: blurred ellipse anchored below the cube -->
    <div class="shadow"></div>

  </div><!-- /.wrapper -->
</body>
</html>
