<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lighting, Dust &amp; Grid</title>
  <style>
    /* ── Reset & full-viewport layout ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #070711;   /* near-black, slightly blue-tinted */
    }

    /*
     * The light-bloom layer sits behind the canvas and is drawn entirely
     * with CSS radial gradients — no external resources needed.
     */
    #bloom {
      position: fixed;
      inset: 0;
      /* Primary upper-centre glow: indigo → transparent */
      background:
        radial-gradient(ellipse 70% 55% at 50% -5%,  rgba(99,102,241,0.28) 0%, transparent 72%),
        radial-gradient(ellipse 45% 35% at 50%  0%,   rgba(139,92,246,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 55% 40% at 50%  8%,   rgba(34,211,238,0.10) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Canvas occupies the same stacking space, above the CSS bloom */
    #fx {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="bloom"></div>
  <canvas id="fx"></canvas>

  <script>
    /* =========================================================
     *  meshy-grid — Perspective Floor Grid + Light Bloom + Dust
     *  Self-contained Canvas 2D, no external deps.
     * ========================================================= */

    'use strict';

    // ── Canvas setup ─────────────────────────────────────────────
    const canvas = document.getElementById('fx');
    const ctx    = canvas.getContext('2d');

    // Cap pixel ratio at 2 to keep fill-rate manageable on HiDPI.
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    let W = 0;   // logical width  (CSS px)
    let H = 0;   // logical height (CSS px)

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width  = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.scale(DPR, DPR);
    }
    resize();
    window.addEventListener('resize', resize);

    // ── Timing ───────────────────────────────────────────────────
    let startTime = performance.now();

    // ── Perspective grid constants ────────────────────────────────
    /*
     * The grid is rendered on the "floor" plane using a simple perspective
     * projection: a world-space point (wx, wz) is projected to screen space
     * with a single-point-perspective transform.
     *
     * Vanishing point  VP = (W/2, horizonY)
     * Camera eye is at world height `camY` above the floor.
     * Focal length `focalLen` (in world units) controls field-of-view.
     *
     * Projection formula:
     *   screenX = VP.x + wx * (focalLen / wz)
     *   screenY = VP.y + camY * (focalLen / wz)
     */
    const GRID_COLOR_NEAR = 'rgba(99,102,241,0.75)';   // bright indigo close-up
    const GRID_COLOR_FAR  = 'rgba(99,102,241,0.0)';    // fades to invisible at horizon
    const GRID_CELLS      = 28;   // columns on each side of centre line
    const GRID_CELL_SIZE  = 3.5;  // world units between lines
    const CAM_Y           = 5.0;  // camera height above the floor plane
    const FOCAL_LEN       = 6.0;  // perspective focal length (controls FOV)
    const HORIZON_FRAC    = 0.48; // fraction of screen height where horizon sits

    // ── Dust-mote parameters ──────────────────────────────────────
    const PARTICLE_COUNT  = 160;  // capped for performance

    /*
     * Each mote has:
     *   x, y  — logical screen position
     *   vx,vy — velocity (px/s)
     *   r     — radius (px)
     *   alpha — base opacity
     *   phase — for gentle pulsing
     *   depth — 0..1 parallax factor (further = slower, smaller, dimmer)
     */
    const motes = [];

    function spawnMote(i) {
      const depth = 0.15 + Math.random() * 0.85;   // 0.15 = near, 1.0 = far
      const speed = (0.06 + Math.random() * 0.12) * (1 - depth * 0.5);

      motes[i] = {
        x:     Math.random() * W,
        y:     H * 0.3 + Math.random() * H * 0.7,  // mostly in lower 70 %
        vx:    (Math.random() - 0.5) * speed * 18,
        vy:    -(speed * 28 + Math.random() * 12),  // drift upward
        r:     (0.4 + (1 - depth) * 2.0),           // near motes are larger
        alpha: 0.15 + (1 - depth) * 0.5,
        phase: Math.random() * Math.PI * 2,
        depth: depth,
      };
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      spawnMote(i);
      // randomise initial y so they don't all start at the bottom
      motes[i].y = Math.random() * H;
    }

    // ── Perspective projection helper ────────────────────────────
    function project(wx, wz, horizonY, focalLen) {
      /*
       * wx  = world X (positive = right of centre)
       * wz  = world Z depth (positive = away from camera; must be > 0)
       * Returns { sx, sy, scale } — screen-space x/y and 1/wz scale.
       */
      const scale = focalLen / wz;
      return {
        sx:    W / 2 + wx * scale,
        sy:    horizonY + CAM_Y * scale,
        scale: scale,
      };
    }

    // ── Draw the perspective floor grid ──────────────────────────
    function drawGrid(t) {
      const horizonY  = H * HORIZON_FRAC;

      // Scroll offset: grid lines drift toward the viewer at ~0.4 world-units/s.
      const scrollOffset = (t * 0.4) % GRID_CELL_SIZE;

      // World Z extents (how far the grid reaches into the distance).
      const Z_NEAR = 0.3;
      const Z_FAR  = 90;

      // How many depth-lines to draw (Z / cell_size).
      const Z_STEPS = 52;

      // ── Longitudinal lines (running away from camera, left/right) ──
      for (let col = -GRID_CELLS; col <= GRID_CELLS; col++) {
        const wx = col * GRID_CELL_SIZE;

        // Project near & far ends of this column strip.
        const near = project(wx, Z_NEAR, horizonY, FOCAL_LEN);
        const far  = project(wx, Z_FAR,  horizonY, FOCAL_LEN);

        // Fade based on distance from centre column (outer columns dimmer).
        const colFrac = Math.abs(col) / GRID_CELLS;
        const sideFade = Math.max(0, 1 - colFrac * colFrac * 1.4);

        const grad = ctx.createLinearGradient(near.sx, near.sy, far.sx, far.sy);
        grad.addColorStop(0, `rgba(99,102,241,${(0.65 * sideFade).toFixed(3)})`);
        grad.addColorStop(1, 'rgba(99,102,241,0)');

        ctx.beginPath();
        ctx.moveTo(near.sx, near.sy);
        ctx.lineTo(far.sx,  far.sy);
        ctx.strokeStyle = grad;
        ctx.lineWidth   = Math.max(0.3, 1.5 * sideFade);
        ctx.stroke();
      }

      // ── Lateral lines (cross-hatching perpendicular to camera) ──
      for (let step = 0; step <= Z_STEPS; step++) {
        // wz increases logarithmically so lines bunch near horizon naturally.
        const t_step = step / Z_STEPS;
        // Map to Z range with a bias toward the near end for visible grid.
        const wz = Z_NEAR + (Z_FAR - Z_NEAR) * (t_step * t_step);

        // Apply scroll: shift each line by the running offset.
        const wzScrolled = wz - (scrollOffset * t_step * 3.0);
        if (wzScrolled <= 0) continue;

        const leftPt  = project(-GRID_CELLS * GRID_CELL_SIZE, wzScrolled, horizonY, FOCAL_LEN);
        const rightPt = project( GRID_CELLS * GRID_CELL_SIZE, wzScrolled, horizonY, FOCAL_LEN);

        // Opacity fades with distance (more pronounced fade toward horizon).
        const distFade = Math.max(0, 1 - t_step * t_step * 2.5);

        ctx.beginPath();
        ctx.moveTo(leftPt.sx,  leftPt.sy);
        ctx.lineTo(rightPt.sx, rightPt.sy);
        ctx.strokeStyle = `rgba(99,102,241,${(0.55 * distFade).toFixed(3)})`;
        ctx.lineWidth   = Math.max(0.2, 1.2 * distFade);
        ctx.stroke();
      }

      // ── Subtle floor glow (horizontal gradient at base of grid) ──
      const glowH = (H - horizonY) * 0.35;
      const glowGrad = ctx.createLinearGradient(0, horizonY, 0, horizonY + glowH);
      glowGrad.addColorStop(0, 'rgba(99,102,241,0.08)');
      glowGrad.addColorStop(1, 'rgba(99,102,241,0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, horizonY, W, glowH);
    }

    // ── Draw a single dust mote ───────────────────────────────────
    function drawMote(m, t) {
      // Gentle pulse on the alpha channel.
      const pulse = 0.75 + 0.25 * Math.sin(t * 0.8 + m.phase);
      const a     = m.alpha * pulse;

      // Mote colour is a mix of indigo and cyan, tinted by depth.
      const cyanMix = 0.3 + m.depth * 0.4;
      const r = Math.round(99  + cyanMix * (34  - 99));    // ~76
      const g = Math.round(102 + cyanMix * (211 - 102));   // ~143
      const b = Math.round(241 + cyanMix * (238 - 241));   // ~240

      // Soft radial gradient per mote (bloom halo).
      const grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 3.5);
      grad.addColorStop(0,   `rgba(${r},${g},${b},${a.toFixed(3)})`);
      grad.addColorStop(0.35,`rgba(${r},${g},${b},${(a * 0.4).toFixed(3)})`);
      grad.addColorStop(1,   `rgba(${r},${g},${b},0)`);

      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // ── Update mote positions ─────────────────────────────────────
    function updateMotes(dt) {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const m = motes[i];
        m.x += m.vx * dt;
        m.y += m.vy * dt;

        // Respawn mote when it drifts off-screen at the top or sides.
        if (m.y < -20 || m.x < -30 || m.x > W + 30) {
          spawnMote(i);
          motes[i].y = H + 10;   // re-enter from the bottom
          motes[i].x = Math.random() * W;
        }
      }
    }

    // ── Main render loop ──────────────────────────────────────────
    let lastTime = performance.now();

    function frame(now) {
      const elapsed = (now - startTime) / 1000;   // seconds since start
      const dt      = Math.min((now - lastTime) / 1000, 0.05);  // cap delta at 50 ms
      lastTime = now;

      // Clear canvas (background colour already set via body CSS).
      ctx.clearRect(0, 0, W, H);

      // 1. Perspective floor grid.
      drawGrid(elapsed);

      // 2. Dust motes (above the grid, below the bloom — bloom is CSS layer).
      updateMotes(dt);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        drawMote(motes[i], elapsed);
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
